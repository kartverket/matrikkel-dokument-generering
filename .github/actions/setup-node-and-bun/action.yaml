name: Setup bun and node
description: Setup bun and node

runs:
  using: composite

  steps:
    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24